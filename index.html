<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
html, body {
  margin:0;
  height:100%;
  background:white;
  overflow:hidden;
}

iframe {
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  border:none;
  z-index:1;
}

/* cover the top UI (green flag, stop button, outline) */
.cover {
  position: fixed;
  top:0;
  left:0;
  width:100%;
  height:60px; /* adjust if needed */
  background:white;
  z-index:2;
}
</style>
</head>
<body>

<!-- this div will “cover” the green flag and outline -->
<div class="cover"></div>

<iframe src="https://turbowarp.org/1288101812/embed?autoplay&fullscreen" allowfullscreen></iframe>

</body>
</html>
