<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
html, body {
  margin:0;
  height:100%;
  background:white;
  overflow:hidden;
}

iframe {
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  border:none;
  z-index:1;
}

/* White bar to hide top UI, leaving bottom free for ask boxes */
.top-cover {
  position: fixed;
  top:0;
  left:0;
  width:100%;
  height:80px; /* adjust if needed for the green flag and outline */
  background:white;
  z-index:2;
}
</style>
</head>
<body>

<!-- White bar covering only the top part -->
<div class="top-cover"></div>

<iframe src="https://turbowarp.org/1288101812/embed?autoplay&fullscreen&ui=false" allowfullscreen></iframe>

</body>
