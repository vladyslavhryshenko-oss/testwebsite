<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
html, body {
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:white;
}

/* fullscreen iframe for TurboWarp project */
iframe {
  position:fixed;
  top:0;
  left:0;
  width:100vw;
  height:100vh;
  border:none;
  z-index:1;
}

/* White overlays to hide all TurboWarp UI and stage outline */
.top-cover {
  position: fixed;
  top:0;
  left:0;
  width:100%;
  height:80px; /* covers green flag / stop button / top outline */
  background:white;
  z-index:2;
}

.left-cover, .right-cover {
  position: fixed;
  top:80px; /* start below top cover */
  bottom:0;
  width:40px; /* cover left/right stage outline */
  background:white;
  z-index:2;
}

.left-cover { left:0; }
.right-cover { right:0; }
</style>
</head>
<body>

<!-- white rectangles to hide UI -->
<div class="top-cover"></div>
<div class="left-cover"></div>
<div class="right-cover"></div>

<iframe src="https://turbowarp.org/1288101812/embed?autoplay&fullscreen" allowfullscreen></iframe>

</body>
</html>
