<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
html, body {
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:white;
}

/* Fullscreen iframe for your TurboWarp project */
iframe {
  position:fixed;
  top:0;
  left:0;
  width:100vw;
  height:100vh;
  border:none;
  margin:0;
  padding:0;
  z-index:1;
}
</style>
</head>
<body>

<!-- 
  Game fullscreen, UI hidden.
  Green flag, stop button, gray outline completely removed via ui=false
-->
<iframe src="https://turbowarp.org/1288101812/embed?autoplay=true&ui=false&fullscreen=true" allowfullscreen></iframe>

</body>
</html>
