<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
html, body {
  margin:0;
  height:100%;
  background:white;
  overflow:hidden;
}

iframe {
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  border:none;
  z-index:1;
}

/* White bar to cover the top UI */
.top-cover {
  position: fixed;
  top:0;
  left:0;
  width:100%;
  height:80px; /* adjust if needed */
  background:white;
  z-index:2;
}

/* White bars to cover left and right stage outline */
.left-cover, .right-cover {
  position: fixed;
  top:80px; /* start below top cover */
  bottom:0;
  width:40px; /* adjust to cover outline width */
  background:white;
  z-index:2;
}

.left-cover { left:0; }
.right-cover { right:0; }
</style>
</head>
<body>

<div class="top-cover"></div>
<div class="left-cover"></div>
<div class="right-cover"></div>

<iframe src="https://turbowarp.org/1288101812/embed?autoplay&fullscreen" allowfullscreen></iframe>

</body>
</html>
