<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
html, body {
  margin:0;
  height:100%;
  background:white;
  overflow:hidden;
}

/* Fullscreen iframe for your project */
iframe {
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  border:none;
  z-index:1;
}

/* Cover the top UI (green flag, stop button) */
.top-cover {
  position: fixed;
  top:0;
  left:0;
  width:100%;
  height:80px; /* adjust as needed */
  background:white;
  z-index:2;
}

/* Cover the left and right edges of the outline */
.left-cover, .right-cover {
  position: fixed;
  top:80px; /* below the top cover */
  bottom:0;
  width:40px; /* adjust to cover outline width */
  background:white;
  z-index:2;
}

.left-cover { left:0; }
.right-cover { right:0; }
</style>
</head>
<body>

<!-- White rectangles to hide UI and stage outline -->
<div class="top-cover"></div>
<div class="left-cover"></div>
<div class="right-cover"></div>

<iframe src="https://turbowarp.org/1288101812/embed?autoplay&fullscreen&ui=false" allowfullscreen></iframe>

</body>
</html>

</html>
